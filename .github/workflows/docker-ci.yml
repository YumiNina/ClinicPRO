name: Dockerized CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    container:
      image: node:20-alpine

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clinicpro
          POSTGRES_PASSWORD: clinicpro
          POSTGRES_DB: clinicpro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinicpro -d clinicpro_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://clinicpro:clinicpro@postgres:5432/clinicpro_test
      JWT_ACCESS_SECRET: ci_access_secret
      JWT_REFRESH_SECRET: ci_refresh_secret
      ACCESS_TOKEN_EXPIRES: 15m
      REFRESH_TOKEN_EXPIRES: 7d
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: ci_anon_key
      SUPABASE_SERVICE_ROLE_KEY: ci_service_role_key
      FRONTEND_URL: http://localhost:5174

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show container runtime
        run: |
          node --version
          npm --version

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Upload frontend test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dockerized-frontend-test-report
          path: frontend/reports/junit.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend lint
        working-directory: backend
        run: npm run lint

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Upload backend test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dockerized-backend-test-report
          path: backend/reports/junit.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Upload validation build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dockerized-validation-builds
          path: |
            frontend/dist
            backend/dist
          if-no-files-found: error
          retention-days: 7

  build-image:
    name: build-image
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      packages: write

    outputs:
      frontend-image: ${{ steps.image-names.outputs.frontend-image }}
      backend-image: ${{ steps.image-names.outputs.backend-image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Define image names and tags
        id: image-names
        run: |
          repository="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          frontend_image="ghcr.io/${repository}-frontend:${GITHUB_SHA}"
          backend_image="ghcr.io/${repository}-backend:${GITHUB_SHA}"
          {
            echo "frontend-image=${frontend_image}"
            echo "backend-image=${backend_image}"
            echo "frontend-tags<<EOF"
            echo "${frontend_image}"
            if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              echo "ghcr.io/${repository}-frontend:latest"
            fi
            echo "EOF"
            echo "backend-tags<<EOF"
            echo "${backend_image}"
            if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              echo "ghcr.io/${repository}-backend:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image-names.outputs.frontend-tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image-names.outputs.backend-tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create Docker build evidence
        run: |
          mkdir -p docker-build-evidence
          {
            echo "frontend=${{ steps.image-names.outputs.frontend-image }}"
            echo "backend=${{ steps.image-names.outputs.backend-image }}"
            echo "pushed=${{ github.event_name != 'pull_request' }}"
            echo "commit=${GITHUB_SHA}"
          } > docker-build-evidence/images.txt

      - name: Upload Docker build evidence
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-evidence
          path: docker-build-evidence/images.txt
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: build-image
    environment: production

    steps:
      - name: Verify Render deploy hooks are configured
        run: |
          missing_secrets=()
          [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL_FRONTEND }}" ] && missing_secrets+=("RENDER_DEPLOY_HOOK_URL_FRONTEND")
          [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL_BACKEND }}" ] && missing_secrets+=("RENDER_DEPLOY_HOOK_URL_BACKEND")
          if [ ${#missing_secrets[@]} -gt 0 ]; then
            echo "ERROR: The following secrets are required to trigger Render deployments:"
            for secret in "${missing_secrets[@]}"; do
              echo "  - $secret"
            done
            echo "Create Render Deploy Hooks and add them as repository secrets."
            exit 1
          fi

      - name: Trigger frontend deployment on Render
        run: |
          echo "Triggering Render frontend deployment for commit ${GITHUB_SHA}"
          payload="{\"commit\":\"${GITHUB_SHA}\",\"ref\":\"${GITHUB_REF}\",\"service\":\"frontend\",\"repository\":\"${GITHUB_REPOSITORY}\"}"
          response="$(curl -sSL -w '\n%{http_code}' -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL_FRONTEND }}" \
            -H 'Content-Type: application/json' \
            --data "$payload")"
          status="$(echo "$response" | tail -n1)"
          body="$(echo "$response" | sed '$d')"
          echo "Frontend Render response: HTTP $status"
          [ $((status)) -lt 200 ] || [ $((status)) -ge 300 ] && echo "$body" && exit 1 || echo "Frontend deploy triggered successfully"

      - name: Trigger backend deployment on Render
        run: |
          echo "Triggering Render backend deployment for commit ${GITHUB_SHA}"
          payload="{\"commit\":\"${GITHUB_SHA}\",\"ref\":\"${GITHUB_REF}\",\"service\":\"backend\",\"repository\":\"${GITHUB_REPOSITORY}\"}"
          response="$(curl -sSL -w '\n%{http_code}' -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL_BACKEND }}" \
            -H 'Content-Type: application/json' \
            --data "$payload")"
          status="$(echo "$response" | tail -n1)"
          body="$(echo "$response" | sed '$d')"
          echo "Backend Render response: HTTP $status"
          [ $((status)) -lt 200 ] || [ $((status)) -ge 300 ] && echo "$body" && exit 1 || echo "Backend deploy triggered successfully"
