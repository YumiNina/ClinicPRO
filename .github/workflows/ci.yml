name: CI Pipeline

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate / ${{ matrix.project-name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - project-name: frontend
            working-directory: frontend
            artifact-path: dist
          - project-name: backend
            working-directory: backend
            artifact-path: dist
    uses: ./.github/workflows/reusable-node-validate.yml
    with:
      project-name: ${{ matrix.project-name }}
      working-directory: ${{ matrix.working-directory }}
      artifact-path: ${{ matrix.artifact-path }}

  delivery:
    name: delivery
    runs-on: ubuntu-latest
    needs: validate
    environment: production

    steps:
      - name: Simulate controlled delivery
        run: |
          echo "Validation succeeded for frontend and backend."
          echo "Build artifacts were generated and uploaded."
          echo "This workflow performs validation only and does not execute production deployment."
          echo "Actual Render deployment is handled by the dockerized CI workflow using a Render deploy hook."
