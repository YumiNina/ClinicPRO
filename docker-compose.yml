services:

  backend:
    build:
      context: ./backend
      target: dev

    container_name: clinicpro_backend

    ports:
      - "3001:3001"

    env_file:
      - ./backend/.env

    volumes:
      - ./backend:/app
      - /app/node_modules

    command: npm run dev

  frontend:
    build:
      context: ./frontend
      target: dev

    container_name: clinicpro_frontend

    ports:
      - "5174:5174"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    command: npm run dev -- --host

    depends_on:
      - backend
